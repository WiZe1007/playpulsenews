# Supply the private JSON files in Dashboard > Advanced > Secret Files before
# the first deployment. Never add their contents or production secrets to Git.
services:
  - type: web
    name: playpulsenews
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: site
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/start.mjs
    healthCheckPath: /healthz
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: play-pulse-site-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PLAY_PULSE_DATA_DIR
        value: /var/data/play-pulse
      - key: PLAY_PULSE_SEED_FILE
        value: /etc/secrets/play-pulse-news.json
      - key: PLAY_PULSE_OWNER_ID
        sync: false
      - key: PP_PASSWORD_PEPPER
        sync: false
      - key: PLAY_PULSE_READ_TOKEN
        sync: false
      - key: PLAY_PULSE_WRITE_TOKEN
        sync: false
      - key: PLAY_PULSE_SETUP_TOKEN
        sync: false
      - key: PLAY_PULSE_UPSTREAM_SITES_TOKEN
        sync: false

  - type: worker
    name: playpulsenews-bot
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: bot
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node bot.mjs
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: play-pulse-delivery-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: PLAY_PULSE_FEED_URL
        sync: false
      - key: PLAY_PULSE_AUTH_MODE
        value: bearer
      - key: PLAY_PULSE_FEED_TOKEN
        fromService:
          type: web
          name: playpulsenews
          envVarKey: PLAY_PULSE_READ_TOKEN
      - key: PLAY_PULSE_NOTIFICATIONS_ENABLED
        value: "1"
      - key: PLAY_PULSE_NOTIFICATIONS_INTERVAL_SECONDS
        value: "60"
      - key: PLAY_PULSE_NOTIFICATIONS_STATE_FILE
        value: /var/data/play-pulse/notifications.json
      - key: PLAY_PULSE_NOTIFICATIONS_BOOTSTRAP_FILE
        value: /etc/secrets/play-pulse-delivery.json
